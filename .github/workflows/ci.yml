name: CI

on:
  pull_request:
    branches:
      - main
      - "sprint/**"
  # Post-merge verification only on main. Sprint tips are covered by pull_request
  # into sprint/** — avoiding a second CI run when the same SHA is also pushed
  # to sprint/<slug> (e.g. Wave 0 docs PR + sprint branch creation).
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --dev

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: Mypy
        run: uv run mypy

  unit:
    name: Unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          # test_cli_boundary_allow_list_is_byte_identical_to_main
          # (tests/unit/test_apps_boundaries.py, Sprint 047) diffs the CLI's
          # import-boundary allow-list against origin/main via `git show`. A
          # default shallow/single-ref checkout doesn't fetch main, so that
          # assertion silently skips instead of enforcing anything. Full
          # history keeps it a real check, not a no-op. This lives on the
          # unit job, not cli, because that's the job that actually runs
          # tests/unit/.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --dev

      - name: Run unit tests
        run: >
          uv run pytest
          tests/unit
          -m "not ml and not ml_trees and not torch"
          --cov=trading_framework
          --cov-report=term-missing
          --cov-report=xml
          -q

  integration:
    name: Integration tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --dev

      - name: Run integration tests
        run: uv run pytest tests/integration -m "not tier2_databento" -q

  build:
    name: Build package
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Build package
        run: uv build

      - name: Show build artifacts
        run: ls -la dist/

  ml:
    name: ML extra tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra ml --dev

      - name: Run ML extra tests
        run: uv run pytest -m ml -q

  ml_trees:
    name: ML trees extra tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra ml --extra ml-trees --dev

      - name: Run ML trees extra tests
        run: uv run pytest -m ml_trees -q

  dl:
    name: DL extra tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install project
        run: uv sync --locked --extra dl --dev

      - name: Run DL extra tests
        env:
          TRADING_FRAMEWORK_RUN_TORCH_TESTS: "1"
        run: uv run pytest -m torch -q

  dashboard:
    name: Dashboard tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install workspace (including apps/dashboard)
        run: uv sync --locked --dev --all-packages

      - name: Dashboard ruff
        run: uv run --package trading-dashboard ruff check apps/dashboard

      - name: Dashboard tests
        run: uv run --package trading-dashboard pytest apps/dashboard/tests -q

  cli:
    name: CLI tests
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version-file: ".python-version"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          version: "0.11.22"
          enable-cache: true

      - name: Install workspace (including apps/cli)
        run: uv sync --locked --dev --all-packages

      - name: CLI ruff
        run: uv run --package trading-cli ruff check apps/cli

      - name: CLI tests
        run: uv run --package trading-cli pytest apps/cli/tests -q
