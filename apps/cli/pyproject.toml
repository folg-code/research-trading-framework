[project]
name = "trading-cli"
version = "0.1.0"
description = "Operator CLI for the trading research framework (trading-cli)"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0.0",
    "trading-framework",
]

[project.scripts]
trading-cli = "trading_cli.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "trading_cli"

[tool.uv.sources]
trading-framework = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["trading_cli"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
