# apps/cli/examples/predictive/btc_momentum_regime_study_regression.yaml
#
# Real-data BTC predictive study, REGRESSION pass (Sprint 052 / S052-T002,
# Phase 15B). Declares the study half of D-S052-06's Pass 1: one continuous
# forward_return target (LabelKind.REGRESSION), PredictiveTask=FORWARD_RETURN
# (the default, elided from the serialized payload -- ADR-0031 Decision 2),
# over Sprint 051's six components plus four incumbents on BTCUSDT.P
# (D-S052-05's frozen ten-feature list, S052_WAVE0_DECISIONS.md).
#
# This is a SEPARATE PredictiveStudySpec file from the BINARY pass
# (btc_momentum_regime_study_binary.yaml), not two labels on one spec:
# PredictiveStudySpec.label is a single LabelSpec
# (src/trading_framework/research/predictive/spec.py), and D-S052-06 runs one
# REGRESSION pass and one BINARY pass over the same sample universe and fold
# plan -- the label KIND is the only thing that differs between the two
# files. Both share the same dataset_ref, time_range, features, split, and
# evaluation_timeframe, byte-for-byte.
#
# Fold plan matches S052_WAVE0_DECISIONS.md D-S052-03 exactly (frozen,
# maintainer-reviewed 2026-09-08): V=15m, F=6, T=30d, E=1d, M=2000,
# EXPANDING mode. Label horizon 1h (4 evaluation bars @ 15m), same horizon as
# the BINARY pass.
#
# Loads and validates through `load_predictive_study_spec` with no code
# change (network-free, extra-free parse test:
# tests/unit/research/predictive/test_btc_momentum_regime_study.py).
#
# Sprint 052 does not RUN this study (that is S052-T003, maintainer-executed
# with the `ml` extra) -- this file only commits and parse-validates the
# declared configuration (SPRINT_052.md acceptance criterion 2).
#
# definition_hash: 96c5fa2c0338d1ddafdbb8dfa197a3213df555627c5b546e356df32d21bce7d8

study:
  study_id: btc_momentum_regime_study_regression
  dataset_ref:
    dataset_id: BTCUSDT.P|ohlcv|1m|binance|binance-usdm-klines-v1
    version: 1
  time_range:
    start: 2024-01-01
    end: 2026-06-30
  evaluation_timeframe: 15m
  features:
    - component_id: momentum.rsi
      parameters:
        period: 14
      output_id: value
      alias: momentum_rsi_14
      transform: NONE
    - component_id: momentum.macd
      parameters:
        fast_period: 12
        slow_period: 26
        signal_period: 9
      output_id: histogram
      alias: momentum_macd_histogram
      transform: NONE
    - component_id: momentum.stochastic
      parameters:
        period: 14
        smoothing_period: 3
      output_id: k
      alias: momentum_stochastic_k
      transform: NONE
    - component_id: volatility.relative_volatility
      parameters:
        period: 20
        baseline_period: 100
      output_id: ratio
      alias: volatility_relative_volatility_ratio
      transform: NONE
    - component_id: statistics.return_autocorrelation
      parameters:
        period: 60
        lag: 1
      output_id: value
      alias: statistics_return_autocorrelation
      transform: NONE
    - component_id: statistics.return_distribution
      parameters:
        period: 60
      output_id: skew
      alias: statistics_return_distribution_skew
      transform: NONE
    - component_id: volatility.atr
      parameters:
        period: 14
      output_id: value
      alias: volatility_atr_14
      transform: NONE
    - component_id: trend.slope
      parameters:
        period: 20
      output_id: value
      alias: trend_slope_20
      transform: NONE
    - component_id: candle.wick
      parameters: {}
      output_id: upper_wick_ratio
      alias: candle_wick_upper_ratio
      transform: NONE
    - component_id: volatility.range_expansion
      parameters:
        period: 14
      output_id: ratio
      alias: volatility_range_expansion_ratio
      transform: NONE
  label:
    kind: REGRESSION
    horizon: 1h
  split:
    mode: EXPANDING
    fold_count: 6
    test_span: 30d
    embargo_span: 1d
    min_train_rows: 2000
