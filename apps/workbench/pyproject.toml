[project]
name = "trading-workbench"
version = "0.1.0"
description = "Private local operator control surface (Research Workbench) for the trading research framework"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "aiohttp>=3.14.1",
    "trading-framework",
]

[project.scripts]
workbench-api = "workbench_core.__main__:main"

[build-system]
requires = ["uv_build>=0.11.14,<0.12.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "workbench_core"

[tool.uv.sources]
trading-framework = { workspace = true }

[dependency-groups]
dev = [
    "mypy>=2.1.0",
    "pytest>=9.1.0",
    "ruff>=0.15.18",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
addopts = ["--strict-markers", "--strict-config", "-ra"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["workbench_core", "workbench_ui"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"
