repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.14.10
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --all-packages mypy
        language: system
        pass_filenames: false

      - id: pytest
        name: pytest
        entry: uv run pytest
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: dashboard-pytest
        name: dashboard pytest
        entry: uv run --package trading-dashboard pytest apps/dashboard/tests
        language: system
        pass_filenames: false
        stages: [pre-push]
